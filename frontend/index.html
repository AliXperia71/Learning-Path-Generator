<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseForge</title>

    <!-- Chakra Petch — the wordmark face. Loaded via <link> rather than a CSS
         @import so the browser can start fetching it immediately instead of
         waiting to parse the stylesheet first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Browser/OS chrome picks up the forge navy -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#071019" />
    <!-- Opt out of browser forced/auto dark mode; page supports both light and dark natively -->
    <meta name="color-scheme" content="light dark">
    <!-- Apply saved/system theme before first paint to avoid a white flash -->
    <script>
      const t = localStorage.getItem('cf_theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
