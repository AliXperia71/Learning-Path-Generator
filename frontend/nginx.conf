# Serves the built React app and proxies the API, so the browser only ever talks
# to one origin. Copied to /etc/nginx/conf.d/default.conf by frontend/Dockerfile.
#
# This file is included inside nginx's http{} block, so the map directives below
# are legal here.

# The real client IP, for rate limiting.
#
# Behind Cloudflare the request arrives as: browser -> CF edge -> cloudflared ->
# nginx, so $remote_addr is a container address and useless. Cloudflare sets
# CF-Connecting-IP at the edge and OVERWRITES any value the client sent, which
# makes it the trustworthy one. Falls back to the normal X-Forwarded-For chain
# when there's no Cloudflare in front (local `docker compose up`).
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $proxy_add_x_forwarded_for;
}

# TLS is terminated by Cloudflare, so nginx itself only ever sees http. Pass the
# original scheme through when a proxy told us what it was.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # routes/resume.py rejects resumes over 5MB itself. nginx's 1MB default would
    # 413 first, and the user would never see the app's own error.
    client_max_body_size 8m;

    # React owns routing client-side. Without this fallback, refreshing on any
    # route other than / returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles, so a cached copy pins users to the
    # previous deploy's JS. It must always be revalidated. (try_files above does
    # an internal redirect, which re-runs location matching, so the fallback
    # lands here too.)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # No trailing path on proxy_pass, so the full /api/... URI is preserved —
    # that's where main.py mounts every router.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        # Rate limiting depends on this. services/rate_limit.py keys auth
        # endpoints off X-Forwarded-For[0]; without the header every user on the
        # internet would share one login bucket, because the only IP the backend
        # can see is nginx's. See the $client_ip map above.
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Path generation is a real Azure OpenAI round-trip plus YouTube fetches
        # (~33s measured). nginx's 60s default would cut a slow one off mid-flight.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # Hashed Vite bundles are immutable — their filenames change on every build.
    # One header, not `expires` plus `add_header`, which emits two.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# www.<anything> -> the bare domain, permanently.
#
# Not cosmetic: the session JWT lives in localStorage, which is scoped per
# origin. If both hostnames served the app, signing in on www and then landing
# on the apex would silently look like being logged out. One canonical origin
# also means Google OAuth only has to trust one.
#
# The pattern is generic, so no domain is hardcoded here. https is literal
# because Cloudflare terminates TLS — nginx itself only ever sees http.
server {
    listen 80;
    server_name ~^www\.(?<bare_domain>.+)$;
    return 301 https://$bare_domain$request_uri;
}
